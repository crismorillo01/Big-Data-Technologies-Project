# Docker Compose for the OPTIONAL Airflow setup.
#
# This file is provided as a heavier alternative to `airflow standalone`,
# in case the native install doesn't fit your machine and you'd rather
# isolate Airflow inside a container. It uses the official Apache image
# in standalone mode so you still don't need a separate Postgres or Redis.
#
# Usage:
#   docker compose up -d
#   open http://localhost:8080
#   # The default admin credentials are printed in `docker compose logs airflow`.
#   docker compose down               # stop without losing the metadata DB
#   docker compose down -v            # nuke the metadata DB
#
# RAM budget (Docker Desktop on a Mac):
#   - Airflow standalone container: ~1.0 GB
#   - Spark sessions launched by the BashOperator run on the host, NOT inside
#     the container, because spark-submit needs access to the project files.
#   - Recommend giving Docker Desktop 2 GB RAM only (more is wasteful).

services:
  airflow:
    image: apache/airflow:2.9.2-python3.11
    container_name: vuln-intel-airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    ports:
      - "8080:8080"
    volumes:
      # Mount the repo so the DAG can spark-submit our scripts directly.
      - ./:/opt/airflow/project:ro
      - ./dags:/opt/airflow/dags:ro
      - airflow_data:/opt/airflow
    command: standalone

volumes:
  airflow_data:
